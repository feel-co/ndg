name: Build and Test with Cargo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      files_changed: ${{ steps.changed-files.outputs.files }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            files:
              - '.github/workflows/rust.yml'
              - '.clippy.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'ndg/**'
              - 'ndg-commonmark/**'
  build:
    name: Build with Cargo
    needs: changes
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

  features:
    name: Feature configurations
    needs: changes
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable

      - name: Check Syntect backend
        run: |
          cargo check -p ndg-commonmark --no-default-features --features syntect --lib
          cargo check -p ndg-commonmark --no-default-features --features ndg-flavored,syntect --all-targets

  lint:
    name: Format and lint
    needs: changes
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    outputs:
      passed: ${{ steps.nextest.outputs.passed }}
      total: ${{ steps.nextest.outputs.total }}
      pct: ${{ steps.nextest.outputs.pct }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-nextest

      - name: Run nextest
        id: nextest
        run: |
          # Enable experimental libtest-json output
          export NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1

          # Run tests and capture NDJSON output
          cargo nextest run --message-format libtest-json-plus > test-output.ndjson || true

          # Count passed / failed tests
          passed=$(jq -c '. | select(.type=="test" and .event=="ok")' test-output.ndjson | wc -l)
          failed=$(jq -c '. | select(.type=="test" and .event=="failed")' test-output.ndjson | wc -l)

          # Numbers must be integers
          passed=$(echo "$passed" | tr -d '[:space:]')
          failed=$(echo "$failed" | tr -d '[:space:]')
          total=$((passed + failed))

          if [ "$total" -gt 0 ]; then
            pct=$(awk "BEGIN {printf \"%d\", ($passed / $total) * 100}")
          else
            pct=0
          fi

          echo "passed=$passed" >> $GITHUB_OUTPUT
          echo "failed=$failed" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "pct=$pct" >> $GITHUB_OUTPUT

      - name: Generate Shields.io Badge JSON
        run: |
          mkdir -p badges
          color=$(awk 'BEGIN {
            if ('${{ steps.nextest.outputs.pct }}' >= 90) print "brightgreen";
            else if ('${{ steps.nextest.outputs.pct }}' >= 70) print "yellowgreen";
            else print "red";
          }')

          # Badge for cargo-nextest results. We can probably add some more if we care to
          # in the future.
          cat > badges/test-badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "tests",
            "message": "${{ steps.nextest.outputs.passed }}/${{ steps.nextest.outputs.total }} (${{ steps.nextest.outputs.pct }}%)",
            "color": "$color"
          }
          EOF

      - name: Deploy Test Badge to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: badges
          keep_files: true

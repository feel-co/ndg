name: Publish Crates

on:
  workflow_dispatch:
  # Tag and Release only runs from main or manual dispatch.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Tag and Release"]
    types:
      - completed

jobs:
  publish:
    name: Publish ndg-commonmark
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable

      - name: Cache cargo registry and index
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Publish ndg-commonmark
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_SECRET }}" ]; then
            echo "CARGO_REGISTRY_SECRET is not set. Skipping publish."
            exit 0
          fi

          OUTPUT=$(cargo publish -p ndg-commonmark \
            --no-verify --locked --token ${{ secrets.CARGO_REGISTRY_SECRET }} 2>&1) && echo "$OUTPUT" || {
            if echo "$OUTPUT" | grep -q "already exists"; then
              echo "Version already published on crates.io, skipping."
              exit 0
            fi
            echo "$OUTPUT" >&2
            exit 1
          }

      - name: Wait for ndg-commonmark to be available
        run: |
          for i in {1..10}; do
            sleep 3
            cargo search ndg-commonmark | grep -q ndg-commonmark && break
          done

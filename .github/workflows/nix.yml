name: Nix Build

on:
  workflow_call:
  pull_request:
  push:
    branches: ["main"]

jobs:
  changes:
    name: "Detect Changed Files"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      files_changed: ${{ steps.changed-files.outputs.files }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Get changed files"
        id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
           filters: |
             files:
               - '.github/workflows/nix.yml'
               - 'Cargo.toml'
               - 'Cargo.lock'
               - 'ndg/**'
               - 'ndg-commonmark/**'
               - 'xtask/**'
               - 'nix/*'
               - 'flake.nix'
               - 'flake.lock'
               - '**.rs'
  nix:
    name: Build with Nix
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    strategy:
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
        package:
          - ndg
          - ndg-builder

    steps:
      # This registers QEMU with the `F` flag. The kernel opens the emulator
      # when it registers it, thus the Nix sandbox does not need the emulator
      # path.
      - name: "Set up QEMU support"
        if: runner.arch == 'X64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            # Allow cross-compiling
            extra-platforms = aarch64-linux armv7l-linux i686-linux

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: feel-co
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Build packages"
        run: nix build -L .#packages.${{ matrix.system }}.${{ matrix.package }} -v

      # For debugging purposes, the default check is standalone so
      # it can be opened or served with zero overhead.
      - name: Upload doc artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "ndg-checks-${{ matrix.system }}-default"
          path: result/share/doc/*
          overwrite: true
